<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kamera-Diagnose</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #000;
        color: #fff;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
      }
      #video {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      #guide {
        width: 80%;
        max-width: 24rem;
        aspect-ratio: 3 / 2;
        border-radius: 8px;
        outline: 2px solid rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      }
      #stats {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        margin: 0;
        padding: 8px 10px;
        background: rgba(0, 0, 0, 0.72);
        white-space: pre-wrap;
        font-size: 11px;
      }
      #controls {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        gap: 8px;
        padding: 10px;
        background: rgba(0, 0, 0, 0.72);
      }
      button {
        flex: 1;
        padding: 12px 8px;
        font: 12px system-ui, sans-serif;
        color: #fff;
        background: #333;
        border: 1px solid #666;
        border-radius: 8px;
      }
      #report {
        position: fixed;
        bottom: 62px;
        left: 0;
        right: 0;
        max-height: 22vh;
        overflow-y: auto;
        padding: 0 10px;
        font-size: 11px;
        color: #9f9;
      }
    </style>
  </head>
  <body>
    <video id="video" playsinline autoplay muted></video>
    <div id="overlay"><div id="guide"></div></div>
    <pre id="stats">Kamera startet…</pre>
    <div id="report"></div>
    <div id="controls">
      <button id="shape">Stream: hochkant</button>
      <button id="region">Liest: Rahmen</button>
    </div>
    <script type="module" src="/src/dev/cameraTest.ts"></script>
  </body>
</html>
