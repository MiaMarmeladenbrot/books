<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kamera-Diagnose</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #111;
        color: #fff;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
      }
      #video {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      #guide {
        width: 80%;
        max-width: 24rem;
        aspect-ratio: 3 / 2;
        border-radius: 8px;
        outline: 2px solid rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
      }
      #stats {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        margin: 0;
        padding: 10px;
        background: rgba(0, 0, 0, 0.78);
        white-space: pre-wrap;
        font-size: 11.5px;
        padding-top: max(10px, env(safe-area-inset-top));
      }
      #controls {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        background: rgba(0, 0, 0, 0.78);
      }
      button {
        flex: 1 1 40%;
        padding: 14px 8px;
        font: 13px system-ui, sans-serif;
        color: #fff;
        background: #2f2f2f;
        border: 1px solid #6a6a6a;
        border-radius: 8px;
      }
      #start {
        flex-basis: 100%;
        background: #b4552f;
        border-color: #b4552f;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <video id="video" playsinline autoplay muted></video>
    <div id="overlay"><div id="guide"></div></div>
    <pre id="stats"></pre>
    <div id="controls">
      <button id="start">Kamera starten</button>
      <button id="shape">Stream: hochkant</button>
      <button id="region">Liest: Rahmen</button>
    </div>
    <script type="module" src="/src/dev/cameraTest.ts"></script>
  </body>
</html>
